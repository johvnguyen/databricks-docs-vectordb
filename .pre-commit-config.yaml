repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # robots.txt fixture is a verbatim copy of the live file; never rewrite it.
      - id: trailing-whitespace
        exclude: ^tests/fixtures/robots\.txt$
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/robots\.txt$
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version matches the one in your pyproject.toml
    rev: v0.4.4
    hooks:
      # Run the linter
      - id: ruff
        args: [ --fix, --select, I ]
      # Run the formatter
      - id: ruff-format
