[project]
name = "databricks-docs-vectordb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "johvnguyen", email = "johvnguyen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "litellm>=1.103.0",
    "lxml>=6.1.3",
    "protego>=0.6.2",
    "python-dotenv>=1.2.3",
    "tiktoken>=0.14.0",
]

[project.scripts]
databricks-docs-vectordb = "databricks_docs_vectordb.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.uv.build-backend]
module-root=""

[tool.pytest.ini_options]
markers = ["network: hits the live Databricks docs site (run with `-m network`)"]
addopts = "-m 'not network'"
asyncio_mode = "auto"
