services:
  dev:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - .:/workspaces/databricks-docs-vectordb:cached
    command: sleep infinity

  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:?QDRANT_API_KEY is not set. Add it to .env at the repo root (see .env.example).}"
    ports:
      - "6333:6333"
